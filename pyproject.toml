[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-archive-cleaner"
version = "1.0.0"
description = "Review and clean Telegram archives with duplicate detection, link checks, backups, a local web UI, and CLI tools."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Amirreza Farnam Taheri", email = "taheri.farnam@gmail.com" }
]
keywords = [
    "telegram",
    "telethon",
    "cleaner",
    "duplicate-detection",
    "archive-cleaner",
    "saved-messages",
    "channel-cleaner",
    "fastapi",
]

dependencies = [
    "telethon>=1.36.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "socksio>=1.0.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
optional = [
    "rapidfuzz>=3.9.0",
    "google-genai>=0.5.0",
    "openai>=1.20.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]
all = ["telegram-archive-cleaner[optional,dev]"]

[project.scripts]
tg-cleaner = "tg_cleaner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_cleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:phoenix"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "E501", "B008"]
