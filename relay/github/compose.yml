services:
  worker:
    build:
      context: ../..
      dockerfile: relay/github/Dockerfile
    restart: unless-stopped
    environment:
      RELAY_SHARED_SECRET_FILE: /run/secrets/relay_shared_secret
      PORT: "8789"
      HOST: "0.0.0.0"
    secrets:
      - relay_shared_secret
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - worker
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?RELAY_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

secrets:
  relay_shared_secret:
    file: ${RELAY_SHARED_SECRET_FILE:?RELAY_SHARED_SECRET_FILE is required}

volumes:
  caddy_data:
  caddy_config:
